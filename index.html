<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOHOM 스마트 안내방송</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            text-align: center; 
            padding: 0; 
            margin: 0; 
            background-color: #f4f6f9; 
            transition: background-color 0.3s;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* 상단 타이틀 바 */
        /* 상단 헤더: 제목 중앙 + 오른쪽 톱니 설정 버튼 */
        .header { 
            width: 100%; 
            background-color: #1e3a8a; 
            color: white; 
            padding: 18px 16px;
            font-size: 20px; 
            font-weight: bold; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-title { flex: 1; text-align: center; }
        .header-settings-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            font-size: 22px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .header-settings-btn:active { background: rgba(255,255,255,0.3); }
        .header-settings-btn.active { background: rgba(255,255,255,0.35); }

        /* 헤더 아래 단지명 표시 바 */
        .complex-name-bar {
            display: none;
            width: 100%;
            background-color: #1e40af;
            color: #bfdbfe;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 16px;
            text-align: left;
            letter-spacing: 0.3px;
        }
        .complex-name-bar.show { display: block; }

        /* 메인 대시보드 박스 - 스마트폰 화면 정중앙 배치 */
        .dashboard { 
            flex: 1;
            width: 100%;
            max-width: 600px; 
            margin: 30px auto 0 auto; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center; 
        }
        
        /* 목소리 선택 버튼 탭 */
        .mode-selector { 
            display: flex; 
            justify-content: center; 
            gap: 6px; 
            margin-bottom: 25px; 
            background: #e2e8f0; 
            padding: 6px; 
            border-radius: 30px; 
        }
        .mode-btn { 
            flex: 1; 
            padding: 12px 4px; 
            font-size: 13px; 
            font-weight: bold; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            background: transparent; 
            color: #475569; 
            transition: all 0.3s;
            white-space: nowrap;
        }
        
        body.adult-male-mode .mode-btn.adult-male { background: #1e3a8a; color: white; }
        body.adult-female-mode .mode-btn.adult-female { background: #9333ea; color: white; }
        body.child-mode { background-color: #fffbeb; }
        body.child-mode .mode-btn.child { background: #f59e0b; color: white; }
        body.child-mode .child-hide { display: none !important; }

        /* 5개 카테고리 안내방송 버튼 (기존 4개 + 방송문 작성) */
        .container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            margin-bottom: 25px; 
        }
        .btn { 
            padding: 35px 10px; 
            font-size: clamp(13px, 3.5vw, 18px);
            font-weight: bold; 
            cursor: pointer; 
            border: 2px solid #cbd5e1; 
            border-radius: 16px; 
            background-color: white; 
            transition: all 0.2s; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            word-break: keep-all;
        }
        
        body.adult-male-mode .btn.selected { border-color: #1e3a8a; background-color: #eff6ff; color: #1e3a8a; }
        body.adult-female-mode .btn.selected { border-color: #9333ea; background-color: #f3e8ff; color: #7e22ce; }
        body.child-mode .btn.selected { border-color: #f59e0b; background-color: #fef3c7; color: #d97706; }

        /* 방송문 작성 버튼은 폭 전체를 차지하도록 강조 */
        .btn.write-btn {
            grid-column: 1 / -1;
            background-color: #f0fdf4;
            border-color: #16a34a;
            color: #15803d;
        }
        body.adult-male-mode .btn.write-btn.selected, body.adult-female-mode .btn.write-btn.selected { border-color: #16a34a; background-color: #dcfce7; color: #15803d; }
        body.child-mode .btn.write-btn.selected { border-color: #16a34a; background-color: #dcfce7; color: #15803d; }

        /* 내 음성파일 재생 버튼도 폭 전체를 차지하도록 강조 */
        .btn.upload-btn {
            background-color: #eff6ff;
            border-color: #2563eb;
            color: #1d4ed8;
            padding: 35px 10px;
            font-size: 16px;
        }        body.adult-male-mode .btn.upload-btn.selected, body.adult-female-mode .btn.upload-btn.selected { border-color: #2563eb; background-color: #dbeafe; color: #1d4ed8; }
        body.child-mode .btn.upload-btn.selected { border-color: #2563eb; background-color: #dbeafe; color: #1d4ed8; }

        .upload-hint {
            margin: 0 0 14px 0;
            font-size: 13.5px;
            color: #64748b;
            line-height: 1.5;
        }
        #audio-file-input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
        }
        .uploaded-name {
            display: none;
            margin-top: 12px;
            padding: 10px 12px;
            background: #eff6ff;
            border-radius: 10px;
            color: #1d4ed8;
            font-size: 14px;
            font-weight: bold;
            text-align: left;
        }
        .uploaded-name.show { display: block; }

        /* 현재 상태 표시 창 */
        .status-text { 
            font-size: 16px; 
            color: #475569; 
            font-weight: bold; 
            margin-bottom: 25px; 
            background: #e2e8f0; 
            padding: 15px; 
            border-radius: 12px; 
            width: 100%; 
        }
        body.child-mode .status-text { background: #fef3c7; color: #b45309; }

        /* 방송문 작성 입력 패널 */
        .write-panel {
            display: none;
            background: white;
            border: 2px solid #16a34a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }
        .write-panel.open { display: block; }
        .write-panel h3 {
            margin: 0 0 15px 0;
            color: #15803d;
            font-size: 17px;
            text-align: center;
        }
        .field-row {
            margin-bottom: 12px;
        }
        .field-row label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 6px;
        }
        .field-row input {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-family: inherit;
        }
        .field-row input:focus {
            outline: none;
            border-color: #16a34a;
        }
        .generate-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            background-color: #16a34a;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 8px;
        }
        .generate-btn:active { background-color: #15803d; }

        /* 생성된 방송문 결과 영역 */
        .result-box {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: #f8fafc;
            border: 1.5px dashed #94a3b8;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.7;
            color: #1e293b;
            text-align: left;
            white-space: pre-wrap;
        }
        .result-box.show { display: block; }

        /* 개인정보 입력 경고 박스: 동/호수, 전화번호, 차량번호 등이 감지되면 표시 */
        .privacy-warning {
            display: none;
            margin-top: 10px;
            padding: 12px 14px;
            background: #fef2f2;
            border: 1.5px solid #f87171;
            border-radius: 10px;
            color: #b91c1c;
            font-size: 13.5px;
            font-weight: bold;
            text-align: left;
            line-height: 1.5;
        }
        .privacy-warning.show { display: block; }

        .field-row textarea {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-family: inherit;
            resize: vertical;
            line-height: 1.6;
        }
        .field-row textarea:focus {
            outline: none;
            border-color: #16a34a;
        }
        .btn-copy {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            background-color: #1e3a8a;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }


            display: none;
            gap: 8px;
            margin-top: 10px;
        }
        .result-controls.show { display: flex; }
        .result-controls button {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-listen { background-color: #2563eb; color: white; }
        .btn-listen.active { background-color: #ef4444; }
        .btn-edit { background-color: #e2e8f0; color: #334155; }

        .chatgpt-guide {
            margin-top: 12px;
            padding: 14px 16px;
            background: #f0fdf4;
            border: 1.5px solid #16a34a;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.9;
        }
        .chatgpt-guide-step {
            font-weight: bold;
            color: #15803d;
            font-size: 15px;
            margin-bottom: 6px;
        }
        .chatgpt-guide-desc { color: #1e293b; }
        .chatgpt-guide-desc a { color: #2563eb; font-weight: bold; }

        /* 하단 제어 버튼 영역 (속도 조절, 재생, 중단 가로 정렬) */
        .controls { 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-top: 14px;
        }
        
        /* 속도 조절 창 크기 고정 */
        .speed-select { 
            width: 30%;
            padding: 0 5px; 
            font-size: 15px; 
            font-weight: bold; 
            border-radius: 12px; 
            background: #334155; 
            color: white; 
            border: 1px solid #475569; 
            cursor: pointer; 
            height: 58px; 
            text-align: center; 
        }

        /* 하단 컨트롤 버튼들의 공통 크기 및 가로 정렬 설정 */
        .control-btn { 
            width: 35%;
            font-size: 16px; 
            font-weight: bold; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.2s; 
            white-space: nowrap; /* 글자가 아래로 절대 줄바꿈 되지 않게 고정 */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 58px;
        }
        
        .play-btn { background-color: #10b981; color: white; box-shadow: 0 4px 6px rgba(16, 185, 129, 0.2); }
        .play-btn.active { background-color: #ef4444; animation: pulse 1.5s infinite; }
        .stop-btn { background-color: #64748b; color: white; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        /* 설정 버튼 */
        .btn.settings-btn {
            grid-column: 1 / -1;
            background-color: #f8fafc;
            border-color: #64748b;
            color: #475569;
        }
        body.adult-male-mode .btn.settings-btn.selected, body.adult-female-mode .btn.settings-btn.selected { border-color: #334155; background-color: #e2e8f0; color: #1e293b; }

        /* 기록 버튼 */
        .btn.history-btn {
            background-color: #fdf4ff;
            border-color: #a855f7;
            color: #7e22ce;
            padding: 35px 10px;
            font-size: 16px;
        }
        body.adult-male-mode .btn.history-btn.selected, body.adult-female-mode .btn.history-btn.selected { border-color: #a855f7; background-color: #f3e8ff; color: #7e22ce; }

        /* 메인/방송문작성 탭 바 */
        .tab-bar {
            display: flex;
            width: 100%;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 18px;
        }
        .tab-btn {
            flex: 1;
            padding: 13px 8px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            background: transparent;
            color: #94a3b8;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .tab-btn.active { color: #1e3a8a; border-bottom-color: #1e3a8a; }
        .tab-content { display: none; width: 100%; }
        .tab-content.active { display: block; }

        /* 방송문 작성 탭 - 상황별 템플릿 버튼 */
        .template-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .template-btn {
            padding: 8px 12px;
            font-size: 13px;
            font-weight: bold;
            border: 1.5px solid #cbd5e1;
            border-radius: 20px;
            background: white;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s;
        }
        .template-btn:active,
        .template-btn.active {
            background: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }

        /* 방송문 작성 탭 - 입력 필드 */
        .write-field-label {
            font-size: 13px;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 5px;
            display: block;
        }
        .write-input {
            width: 100%;
            padding: 11px 12px;
            font-size: 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-family: inherit;
            margin-bottom: 10px;
            background: white;
        }
        .write-input:focus {
            outline: none;
            border-color: #1e3a8a;
        }
        .write-textarea {
            width: 100%;
            padding: 11px 12px;
            font-size: 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-family: inherit;
            margin-bottom: 10px;
            resize: vertical;
            line-height: 1.6;
            background: white;
        }
        .write-textarea:focus {
            outline: none;
            border-color: #1e3a8a;
        }


        .settings-view {
            display: none;
            flex: 1;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            flex-direction: column;
        }
        .settings-view.active {
            display: flex;
        }
        .settings-topbar {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: white;
            border-bottom: 1.5px solid #e2e8f0;
        }
        .settings-back-btn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 10px 4px 0;
            color: #1e3a8a;
            display: flex;
            align-items: center;
        }
        .settings-topbar-title {
            font-size: 18px;
            font-weight: bold;
            color: #1e293b;
        }
        .settings-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
        }


        .settings-row {
            margin-bottom: 18px;
        }
        .settings-row label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 7px;
        }
        .settings-row input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-family: inherit;
        }
        .settings-row input[type="text"]:focus {
            outline: none;
            border-color: #64748b;
        }
        .tts-option-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .tts-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            cursor: pointer;
            background: #f8fafc;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tts-option.selected {
            border-color: #1e3a8a;
            background: #eff6ff;
            color: #1e3a8a;
            font-weight: bold;
        }
        .tts-option input[type="radio"] { accent-color: #1e3a8a; }
        .settings-save-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            background-color: #334155;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 4px;
        }
        .settings-save-btn:active { background-color: #1e293b; }

        /* 방송 기록 패널 */
        .history-empty {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            padding: 20px 0;
        }
        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #f8fafc;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .history-item:active { background: #eff6ff; border-color: #1e3a8a; }
        .history-item-info { flex: 1; text-align: left; }
        .history-item-title { font-size: 14px; font-weight: bold; color: #1e293b; }
        .history-item-time { font-size: 12px; color: #64748b; margin-top: 2px; }
        .history-item-play { font-size: 20px; }
        .history-clear-btn {
            width: 100%;
            padding: 11px;
            font-size: 14px;
            font-weight: bold;
            background-color: #fee2e2;
            color: #b91c1c;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body class="adult-male-mode">

        <span class="header-title" style="padding-top:10px; display:block;">📢 KOHOM 스마트 안내방송</span>
        <button class="header-settings-btn" id="header-settings-btn" onclick="toggleSettingsPanel()" title="설정">⚙️</button>
    </div>
    <div class="complex-name-bar" id="complex-name-bar"></div>

    <div class="dashboard">

        <!-- 탭 바 -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tab-main-btn" onclick="switchTab('main')">📢 메인 방송</button>
            <button class="tab-btn" id="tab-write-btn" onclick="switchTab('write')">✍️ 방송문 작성</button>
        </div>

        <!-- 메인 방송 탭 -->
        <div class="tab-content active" id="tab-main">
            <div class="mode-selector">
                <button class="mode-btn adult-male" onclick="changeMode('adult-male')">👨 어른(남)</button>
                <button class="mode-btn adult-female" onclick="changeMode('adult-female')">👩 어른(여)</button>
                <button class="mode-btn child" onclick="changeMode('child')">👧 아이</button>
            </div>

            <div class="container">
                <button class="btn" id="btn-smoke" data-name="간접흡연 방지"
                    data-adult-male="audio/간접흡연2_최무비.mp3"
                    data-adult-female="audio/간접흡연_여_미진.mp3"
                    data-child="audio/간접흡연_아이.mp3"
                    onclick="selectTopic(this)">🚬 간접흡연 방지</button>
                <button class="btn child-hide" id="btn-noise" data-name="층간소음 자제"
                    data-adult-male="audio/층간소음_최무비.mp3"
                    data-adult-female="audio/층간소음_여_미진.mp3"
                    data-child="audio/층간소음_최무비.mp3"
                    onclick="selectTopic(this)">🤫 층간소음 자제</button>
                <button class="btn child-hide" id="btn-pet" data-name="펫티켓 준수"
                    data-adult-male="audio/반려동물_최무비.mp3"
                    data-adult-female="audio/반려동물_여_미진.mp3"
                    data-child="audio/반려동물_최무비.mp3"
                    onclick="selectTopic(this)">🐶 펫티켓 준수</button>
                <button class="btn child-hide" id="btn-throw" data-name="물건투척 금지"
                    data-adult-male="audio/투척2_최무비.mp3"
                    data-adult-female="audio/투척_여_미진.mp3"
                    data-child="audio/투척2_최무비.mp3"
                    onclick="selectTopic(this)">📦 물건투척 금지</button>
                <button class="btn upload-btn" id="btn-upload" onclick="toggleUploadPanel()">🎵 음성파일 재생</button>
                <button class="btn history-btn" id="btn-history" onclick="toggleHistoryPanel()">📋 방송 기록</button>
            </div>

            <!-- 컨트롤: 카테고리 버튼 바로 아래 -->
            <div class="controls">
                <select id="speed-select" class="speed-select" onchange="changeSpeed(this.value)">
                    <option value="0.8">0.8 배속</option>

                <button class="control-btn play-btn" id="main-play-btn" onclick="startBroadcast()">▶ 재생 시작</button>
                <button class="control-btn stop-btn" onclick="stopBroadcast()">⏹ 방송 중단</button>
            </div>

            <!-- 상태 표시 -->
            <div class="status-text" id="status-display">상태: 방송할 주제를 선택해 주세요.</div>

            <!-- 음성파일 불러오기 패널 -->
            <div class="write-panel" id="upload-panel">
                <h3>🎵 내 음성파일 불러오기</h3>
                <p class="upload-hint">미리 녹음해 둔 mp3(또는 다른 오디오) 파일을 선택하면 바로 재생됩니다.</p>
                <input type="file" id="audio-file-input" accept="audio/*" onchange="loadAudioFile(event)">
                <div class="uploaded-name" id="uploaded-name"></div>
            </div>

            <!-- 방송 기록 -->
            <div class="write-panel" id="history-panel">
                <h3>📋 방송 기록</h3>
                <div id="history-list"><div class="history-empty">아직 방송 기록이 없습니다.</div></div>
                <button class="history-clear-btn" onclick="clearHistory()">🗑️ 기록 전체 삭제</button>
            </div>
        </div>

        <!-- 방송문 작성 탭 -->
        <div class="tab-content" id="tab-write">

            <!-- 상황별 템플릿 버튼 -->
            <div style="margin-bottom:6px; font-size:13px; font-weight:bold; color:#64748b;">📌 상황 선택 (누르면 자동 입력)</div>
            <div class="template-grid">
                <button class="template-btn" onclick="applyTemplate('방역소독')">🧴 방역소독</button>
                <button class="template-btn" onclick="applyTemplate('비화재경보')">🔔 비화재경보</button>
                <button class="template-btn" onclick="applyTemplate('정전발생')">⚡ 정전발생</button>
                <button class="template-btn" onclick="applyTemplate('정전복구')">✅ 정전복구</button>
                <button class="template-btn" onclick="applyTemplate('긴급공사')">🔨 긴급공사</button>
                <button class="template-btn" onclick="applyTemplate('직접입력')">✏️ 직접입력</button>
            </div>

            <!-- 일반 필드 -->
            <div id="field-area">
            <span class="write-field-label">📅 언제</span>
            <input type="text" id="write-when" class="write-input" placeholder="날짜/시간을 입력하세요 (예: 내일 오전 9시부터 11시까지)">

            <span class="write-field-label">📍 어디서</span>
            <input type="text" id="write-where" class="write-input" placeholder="장소를 입력하세요 (예: 101동 3층, 지하주차장)">

            <span class="write-field-label">📋 무엇을 (핵심 내용)</span>
            <input type="text" id="write-what" class="write-input" placeholder="예) 방역 소독 작업을 실시합니다">

            <span class="write-field-label">💬 추가 요청 (선택)</span>
            <textarea id="write-extra" class="write-textarea" rows="2" placeholder="예) 차량 이동 부탁드립니다, 미리 물 받아두세요"></textarea>
            </div>

            <div class="privacy-warning" id="privacy-warning"></div>
            <button class="generate-btn" id="ai-generate-btn" onclick="generateWithAI()">📝 방송문 완성하기</button>

            <!-- 결과 / 직접 입력 가능한 방송문 칸 -->
            <div id="ai-result-area" style="display:block; margin-top:14px;">
                <span class="write-field-label">📋 방송문 (직접 입력하거나 붙여넣기도 가능합니다)</span>
                <textarea class="result-box show" id="result-box" style="display:block; width:100%; min-height:180px; resize:vertical; font-family:inherit; font-size:14px; line-height:1.7; padding:14px; border:1.5px dashed #94a3b8; border-radius:12px; background:#f8fafc; color:#1e293b;" placeholder="여기에 방송문을 직접 입력하거나 붙여넣으세요.&#10;또는 위에서 상황을 선택하고 방송문 완성하기를 누르세요." oninput="generatedText=this.value"></textarea>
                <div class="result-controls show" id="result-controls" style="display:flex; margin-top:10px;">
                    <button class="btn-listen" id="listen-btn" onclick="applyAndListen()">🔊 들어보기</button>
                    <button class="btn-copy" onclick="copyResultInput()">📋 복사</button>
                    <button class="btn-edit" onclick="resetAIResult()">🗑️ 지우기</button>
                </div>
                <button onclick="goToMainWithBroadcast()" style="width:100%; margin-top:10px; margin-bottom:60px; padding:14px; background:#1e3a8a; color:white; border:none; border-radius:12px; font-size:15px; font-weight:bold; cursor:pointer;">▶ 메인에서 방송하기</button>
            </div>

            <textarea id="result-input" style="display:none;"></textarea>
        </div>

        <!-- 설정 패널 더미 (JS 참조용) -->
        <div id="settings-panel" style="display:none!important"></div>
    </div>

    <!-- 설정 전체화면 뷰: 톱니 버튼 누르면 dashboard를 숨기고 이 화면으로 전환 -->
    <div class="settings-view" id="settings-view">
        <div class="settings-topbar">
            <button class="settings-back-btn" onclick="closeSettingsView()">◀</button>
            <span class="settings-topbar-title">⚙️ 설정</span>
        </div>
        <div class="settings-body">
            <div class="settings-row">
                <label>단지 이름</label>
                <input type="text" id="complex-name-input" placeholder="예: 행복마을 1단지, 주공아파트">
            </div>
            <div class="settings-row">
                <label>TTS 방송 목소리</label>
                <div style="display:flex; gap:10px; margin-top:6px;">
                    <button id="tts-voice-male" onclick="setTtsGender('male')" style="flex:1; padding:12px; border:2px solid #cbd5e1; border-radius:10px; background:white; font-size:14px; font-weight:bold; cursor:pointer;">👨 남성</button>
                    <button id="tts-voice-female" onclick="setTtsGender('female')" style="flex:1; padding:12px; border:2px solid #cbd5e1; border-radius:10px; background:white; font-size:14px; font-weight:bold; cursor:pointer;">👩 여성</button>
                </div>
                <div style="margin-top:6px; font-size:12px; color:#64748b;">기기에 설치된 TTS 엔진에 따라 목소리가 다를 수 있습니다.</div>
            </div>
            <button class="settings-save-btn" onclick="saveSettings()">💾 저장</button>
        </div>
    </div>

    <!-- 방송 기록 전체화면 뷰 -->
    <div class="settings-view" id="history-view">
        <div class="settings-topbar">
            <button class="settings-back-btn" onclick="closeHistoryView()">◀</button>
            <span class="settings-topbar-title">📋 방송 기록</span>
        </div>
        <div class="settings-body">
            <div id="history-list-view"><div class="history-empty">아직 방송 기록이 없습니다.</div></div>
            <button class="history-clear-btn" onclick="clearHistory()" style="margin-top:12px;">🗑️ 기록 전체 삭제</button>
        </div>
    </div>

    <audio id="bg-audio"></audio>

    <script>
        const audioPlayer = document.getElementById('bg-audio');
        const statusDisplay = document.getElementById('status-display');
        const mainPlayBtn = document.getElementById('main-play-btn');
        const speedSelect = document.getElementById('speed-select');
        const writePanel = { // 탭 기반으로 전환 - write-panel 대신 탭 상태로 판단
            classList: {
                contains: (cls) => cls === 'open' && currentTab === 'write',
                add: () => switchTab('write'),
                remove: () => {}
            }
        };
        const uploadPanel = document.getElementById('upload-panel');
        const settingsPanel = document.getElementById('settings-panel');
        const historyPanel = document.getElementById('history-panel');
        const resultBox = document.getElementById('result-box');
        const resultControls = document.getElementById('result-controls');
        const listenBtn = document.getElementById('listen-btn');

        let currentTab = 'main'; // 현재 활성 탭
        let selectedButton = null; 
        let currentMode = 'adult-male';
        let isPlaying = false;
        let generatedText = "";
        let isSpeaking = false;
        let uploadedAudioUrl = null;
        let uploadedAudioBuffer = null;
        let uploadedAudioName = "";

        // 탭 전환
        window.switchTab = function(tab) {
            currentTab = tab;
            document.getElementById('tab-main-btn').classList.toggle('active', tab === 'main');
            document.getElementById('tab-write-btn').classList.toggle('active', tab === 'write');
            document.getElementById('tab-main').classList.toggle('active', tab === 'main');
            document.getElementById('tab-write').classList.toggle('active', tab === 'write');
            if (tab === 'main') {
                updateStatusText();
            }
        }


        // Web Audio API 관련 상태
        let audioCtx = null;
        let uploadedSourceNode = null; // 현재 재생 중인 Web Audio source
        let uploadedStartTime = 0;    // 재생 시작 시각 (ctx.currentTime 기준)
        let uploadedIsPlaying = false;

        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            // 일부 브라우저/WebView에서 suspended 상태일 수 있으므로 resume
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function stopUploadedAudio() {
            if (uploadedSourceNode) {
                try { uploadedSourceNode.stop(); } catch(e) {}
                uploadedSourceNode.disconnect();
                uploadedSourceNode = null;
            }
            uploadedIsPlaying = false;
        }

        function playUploadedAudio() {
            if (!uploadedAudioBuffer) return;
            const ctx = getAudioContext();
            stopUploadedAudio();

            const source = ctx.createBufferSource();
            source.buffer = uploadedAudioBuffer;

            // 배속 적용
            source.playbackRate.value = parseFloat(speedSelect.value);

            source.connect(ctx.destination);
            source.start(0);

            uploadedSourceNode = source;
            uploadedIsPlaying = true;

            source.onended = function() {
                uploadedIsPlaying = false;
                uploadedSourceNode = null;
                // stopBroadcast와 동일한 UI 초기화
                isPlaying = false;
                mainPlayBtn.classList.remove('active');
                mainPlayBtn.innerHTML = `▶ 재생 시작`;
                updateStatusText();
            };
        }
        let selectedTtsVoice = null;  // 선택된 TTS 음성 객체
        let broadcastHistory = [];    // 방송 기록 (localStorage에 저장)

        // ─────────────────────────────────────────
        // 앱 시작 시 저장된 설정 & 기록 불러오기
        // ─────────────────────────────────────────
        function initApp() {
            // 단지 이름 복원 및 단지명 바 표시
            const savedName = localStorage.getItem('complexName') || '';
            document.getElementById('complex-name-input').value = savedName;
            updateComplexNameBar(savedName);

            // TTS 성별 설정 복원
            const savedGender = localStorage.getItem('ttsGender') || 'female';
            setTtsGender(savedGender, true);

            // 저장된 방송 기록 복원
            try {
                broadcastHistory = JSON.parse(localStorage.getItem('broadcastHistory') || '[]');
            } catch(e) { broadcastHistory = []; }
            renderHistoryList();
        }

        // TTS 성별 선택
        window.setTtsGender = function(gender, init = false) {
            localStorage.setItem('ttsGender', gender);

            const maleBtn = document.getElementById('tts-voice-male');
            const femaleBtn = document.getElementById('tts-voice-female');
            if (maleBtn && femaleBtn) {
                maleBtn.style.borderColor = gender === 'male' ? '#1e3a8a' : '#cbd5e1';
                maleBtn.style.background = gender === 'male' ? '#eff6ff' : 'white';
                femaleBtn.style.borderColor = gender === 'female' ? '#9333ea' : '#cbd5e1';
                femaleBtn.style.background = gender === 'female' ? '#f3e8ff' : 'white';
            }

            // APK: 네이티브 TTS 음성 변경 (실제 남/여 목소리)
            if (window.NativeApp) {
                window.NativeApp.setVoiceGender(gender);
                return;
            }
            // 브라우저: pitch 조절 없이 기본 목소리 그대로 사용
        }

        // NativeApp에서 음성 선택 완료 콜백
        window.onVoiceSelected = function(voiceName) {
            console.log('선택된 TTS 음성:', voiceName);
        }


        function updateComplexNameBar(name) {
            const bar = document.getElementById('complex-name-bar');
            if (name) {
                bar.textContent = `🏢 ${name}`;
                bar.classList.add('show');
            } else {
                bar.classList.remove('show');
                bar.textContent = '';
            }
        }

        // 설정 저장
        window.saveSettings = function() {
            const complexName = document.getElementById('complex-name-input').value.trim();
            localStorage.setItem('complexName', complexName);
            updateComplexNameBar(complexName);
            // TTS 성별은 setTtsGender에서 이미 저장됨


            const btn = document.querySelector('.settings-save-btn');
            btn.textContent = '✅ 저장됐습니다!';
            setTimeout(() => {
                btn.textContent = '💾 저장';
                closeSettingsView();
            }, 900);
        }

        // ─────────────────────────────────────────
        // 방송 기록 저장/렌더링/재생
        // ─────────────────────────────────────────
        function saveBroadcastRecord(title, text, type) {
            const now = new Date();
            const record = {
                id: now.getTime(),
                date: now.toLocaleDateString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit' }),
                time: now.toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' }),
                title: title,
                text: text,
                type: type,
            };
            broadcastHistory.unshift(record);

            // 90일 이전 기록 자동 삭제
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 90);
            broadcastHistory = broadcastHistory.filter(r => r.id > cutoff.getTime());

            localStorage.setItem('broadcastHistory', JSON.stringify(broadcastHistory));
            renderHistoryList();
        }

        function renderHistoryList() {
            const container = document.getElementById('history-list');
            if (!broadcastHistory.length) {
                container.innerHTML = '<div class="history-empty">아직 방송 기록이 없습니다.</div>';
                return;
            }

            // 날짜별 그룹핑
            const grouped = {};
            broadcastHistory.forEach(r => {
                if (!grouped[r.date]) grouped[r.date] = [];
                grouped[r.date].push(r);
            });

            container.innerHTML = '';
            Object.keys(grouped).forEach(date => {
                const dateHeader = document.createElement('div');
                dateHeader.style.cssText = 'font-size:13px;font-weight:bold;color:#64748b;margin:12px 0 6px;text-align:left;';
                dateHeader.textContent = `📅 ${date}`;
                container.appendChild(dateHeader);

                grouped[date].forEach(record => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.innerHTML = `
                        <div class="history-item-info">
                            <div class="history-item-title">${record.title}</div>
                            <div class="history-item-time">${record.time} · ${record.type === 'tts' ? '방송문 TTS' : record.type === 'file' ? '음성파일' : '사전 녹음'}</div>
                        </div>
                        <div class="history-item-play">▶️</div>`;

                    item.addEventListener('click', () => replayRecord(record));
                    container.appendChild(item);
                });
            });
        }

        function replayRecord(record) {
            if (record.type === 'tts' && record.text) {
                stopBroadcast();
                generatedText = record.text;
                isSpeaking = true;
                statusDisplay.textContent = `🔊 기록 재생 중: ${record.title} (${record.date} ${record.time})`;
                speakBysentences(generatedText, () => {
                    isSpeaking = false;
                    statusDisplay.textContent = `기록 재생 완료: ${record.title}`;
                });
            } else {
                statusDisplay.textContent = `📁 ${record.title} (${record.date} ${record.time}) — 음성파일은 다시 불러와서 재생해 주세요.`;
            }
        }

        window.clearHistory = function() {
            broadcastHistory = [];
            localStorage.removeItem('broadcastHistory');
            renderHistoryList();
            renderHistoryListView();
            statusDisplay.textContent = "방송 기록이 삭제되었습니다.";
        }

        window.changeMode = function(mode) {
            currentMode = mode;
            stopBroadcast();
            if (mode === 'adult-male') {
                document.body.className = 'adult-male-mode';
            } else if (mode === 'adult-female') {
                document.body.className = 'adult-female-mode';
            } else {
                document.body.className = 'child-mode';
                // 아이 모드에서 숨겨진 버튼이 선택된 경우 해제
                if (selectedButton && selectedButton.classList.contains('child-hide')) {
                    selectedButton.classList.remove('selected');
                    selectedButton = null;
                }
            }
            updateStatusText();
        }

        window.selectTopic = function(buttonElement) {
            closeAllPanels();
            const allButtons = document.querySelectorAll('.container .btn');
            allButtons.forEach(btn => btn.classList.remove('selected'));
            selectedButton = buttonElement;
            selectedButton.classList.add('selected');
            // 다른 카테고리 선택 시 음성파일 버퍼 초기화
            uploadedAudioBuffer = null;
            uploadedAudioName = '';
            if (isPlaying) { stopBroadcast(); } else { updateStatusText(); }
        }

        function closeAllPanels() {
            writePanel.classList.remove('open');
            uploadPanel.classList.remove('open');
            historyPanel.classList.remove('open');
        }

        // ---------------------------------------------------------
        // 방송문 작성 → 탭 전환으로 대체
        // ---------------------------------------------------------
        window.toggleWritePanel = function() {
            switchTab('write');
        }

        function closeWritePanel() {
            // 탭 구조에서는 메인으로 돌아가는 것으로 처리하지 않음 (탭은 유지)
        }

        // ---------------------------------------------------------
        // 내 음성파일(mp3 등) 불러와서 재생하는 카테고리
        // ---------------------------------------------------------
        window.toggleUploadPanel = function() {
            const allButtons = document.querySelectorAll('.container .btn');
            allButtons.forEach(btn => btn.classList.remove('selected'));
            document.getElementById('btn-upload').classList.add('selected');
            selectedButton = null;
            stopBroadcast();
            const isOpen = uploadPanel.classList.contains('open');
            closeAllPanels();
            if (!isOpen) {
                uploadPanel.classList.add('open');
                if (uploadedAudioBuffer) {
                    statusDisplay.textContent = `대기: [${uploadedAudioName}] 하단 재생 터치`;
                } else {
                    statusDisplay.textContent = "상태: 재생할 음성파일(mp3 등)을 선택해 주세요.";
                }
            }
        }

        // ---------------------------------------------------------
        // 방송 기록 전체화면 전환
        // ---------------------------------------------------------
        window.toggleHistoryPanel = function() {
            const dashboard = document.querySelector('.dashboard');
            const historyView = document.getElementById('history-view');
            stopBroadcast();
            closeAllPanels();
            dashboard.style.display = 'none';
            historyView.classList.add('active');
            renderHistoryListView();
        }

        window.closeHistoryView = function() {
            const dashboard = document.querySelector('.dashboard');
            const historyView = document.getElementById('history-view');
            historyView.classList.remove('active');
            dashboard.style.display = 'flex';
            // 버튼 선택 해제
            document.querySelectorAll('.container .btn').forEach(btn => btn.classList.remove('selected'));
            updateStatusText();
        }

        // 전체화면 기록 목록 렌더링
        function renderHistoryListView() {
            const container = document.getElementById('history-list-view');
            if (!broadcastHistory.length) {
                container.innerHTML = '<div class="history-empty">아직 방송 기록이 없습니다.</div>';
                return;
            }

            const grouped = {};
            broadcastHistory.forEach(r => {
                if (!grouped[r.date]) grouped[r.date] = [];
                grouped[r.date].push(r);
            });

            container.innerHTML = '';
            Object.keys(grouped).forEach(date => {
                const dateHeader = document.createElement('div');
                dateHeader.style.cssText = 'font-size:13px;font-weight:bold;color:#64748b;margin:12px 0 6px;text-align:left;';
                dateHeader.textContent = `📅 ${date}`;
                container.appendChild(dateHeader);

                grouped[date].forEach(record => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.innerHTML = `
                        <div class="history-item-info">
                            <div class="history-item-title">${record.title}</div>

        // ---------------------------------------------------------
        function checkPrivacyRisk(text) {
            const patterns = [
                { regex: /\d{2,4}\s*동\s*\d{1,4}\s*호/, label: "동/호수" },
                { regex: /\d{2,3}-\d{3,4}-\d{4}/, label: "전화번호" },
                { regex: /\d{2,3}[가-힣]\s?\d{4}(?!\s*호)/, label: "차량번호" },
                { regex: /주민등록번호/, label: "주민등록번호 언급" },
                { regex: /차량\s?번호/, label: "차량번호 언급" },
            ];
            const found = [];
            for (const p of patterns) {
                if (p.regex.test(text)) found.push(p.label);
            }
            return found;
        }

        function showPrivacyWarning(labels) {
            const box = document.getElementById('privacy-warning');
            if (labels.length === 0) {
                box.classList.remove('show');

            }
            box.textContent = `⚠️ 입력 내용에 ${labels.join(', ')}로 보이는 정보가 포함되어 있습니다. 안내방송에는 특정 동/호수나 연락처 같은 개인정보를 직접 언급하지 않는 것을 권장합니다. 그래도 진행하시려면 '안내방송 만들기'를 다시 눌러주세요.`;
            box.classList.add('show');
            return true;
        }

        // 예: "주차하면 안된다는 내용으로" -> "주차가 제한됩니다"
        // 사전에 없는 표현은 최대한 자연스러운 종결형으로만 보정
        // ---------------------------------------------------------
        // ---------------------------------------------------------
        // 자유 입력 → 안내방송 문구 변환 (틀 없이, 입력 내용 최대한 그대로)

        // 구어체 표현만 살짝 다듬기 (문장 구조는 건드리지 않음)
        function polishToBroadcastStyle(text) {
            let t = text.trim();

            const fixes = [
                // 반말/구어 종결 → 경어 종결
                [/(\S)해요\b/g, '$1합니다'],
                [/(\S)이에요\b/g, '$1입니다'],
                [/(\S)예요\b/g, '$1입니다'],
                [/됩니다\b/g, '됩니다'],
                [/할게요\b/g, '하겠습니다'],
                [/할거예요\b/g, '할 예정입니다'],
                [/거예요\b/g, '겠습니다'],
                // 요청 표현
                [/해주세요\b|해 주세요\b/g, '하여 주시기 바랍니다'],
                [/세요\b/g, '시기 바랍니다'],
                [/주세요\b/g, '주시기 바랍니다'],
                // 금지 표현
                [/마세요\b|말아주세요\b|말아 주세요\b/g, '주시기 바랍니다'],
                // 비격식 표현
                [/~/g, ''],
                [/ㅎㅎ|ㅋㅋ|ㅠㅠ|😊|😄|🙏/g, ''],
                // 내용으로 마무리 패턴 제거
                [/안\s*된다는\s*내용으로\.?$/g, '안 됩니다'],
                [/한다는\s*내용으로\.?$/g, '합니다'],
                [/라는\s*내용으로\.?$/g, ''],
                [/는\s*내용으로\.?$/g, ''],
                [/내용으로\.?$/g, ''],
            ];

            for (const [p, r] of fixes) t = t.replace(p, r);

            t = t.trim().replace(/\s+/g, ' ');

            // 문장이 마침표로 끝나지 않으면 추가
            if (t && !/[.!?]$/.test(t)) t += '.';

            return t;
        }

        window.applyTemplate = function(type) {
            document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const t = TEMPLATES[type];
            document.getElementById('write-when').value = t.when;

        // 방송문 생성: full 템플릿이 있으면 그대로 사용, 없으면 필드 조합
        window.generateWithAI = function() {
            const when  = document.getElementById('write-when').value.trim();
            const where = document.getElementById('write-where').value.trim();
            const what  = document.getElementById('write-what').value.trim();
            const extra = document.getElementById('write-extra').value.trim();

            if (!what && !when && !where) { alert("내용을 입력해 주세요!"); return; }

            const combined = [when, where, what, extra].join(' ');
            const riskLabels = checkPrivacyRisk(combined);
            const warningShown = showPrivacyWarning(riskLabels);
            if (warningShown && !window.__privacyConfirmed) {
                window.__privacyConfirmed = true;
                return;
            }
            window.__privacyConfirmed = false;

            const complexName = localStorage.getItem('complexName') || '';

            // 현재 선택된 템플릿 찾기
            const activeBtn = document.querySelector('.template-btn.active');
            const activeType = activeBtn ? activeBtn.getAttribute('onclick').replace("applyTemplate('", "").replace("')", "") : null;
            const tmpl = activeType ? TEMPLATES[activeType] : null;

            let result = '';

            if (tmpl && tmpl.full) {
                // 확정 템플릿: full 함수로 생성
                result = tmpl.full(when, where, complexName);

                let body = '';
                if (when && where) body = `${when} ${where}에서 ${polishToBroadcastStyle(what)}`;

                else if (where) body = `${where}에서 ${polishToBroadcastStyle(what)}`;

                result = `${greeting} ${body} ${repeat} ${body} ${closing}`;
            }

            generatedText = result;
            document.getElementById('result-box').value = result;
            
            statusDisplay.textContent = "✅ 방송문 완성! 수정 후 메인 탭에서 재생하세요.";

        // 문장을 마침표 기준으로 나눠서 순서대로 읽는 TTS 함수
        function speakBysentences(text, onEnd) {
            const rate = parseFloat(speedSelect.value);

                    .split(/(?<=[.!?])\s+/)
                    .map(s => s.trim())
                    .filter(s => s.length > 0);
                window._ttsOnEnd = onEnd;
                const json = JSON.stringify(sentences);
                window.NativeApp.ttsSpeakSentences(json, rate);
                return;
            }

            // Web Speech API 폴백
            const pitch = 1.0;
            const sentences = text
                .split(/(?<=[.!?])\s+/)
                .map(s => s.trim())
                .filter(s => s.length > 0);

            if (!sentences.length) return;
            let index = 0;

            function speakNext() {
                if (!isSpeaking) return;
                if (index >= sentences.length) {
                    isSpeaking = false;
                    if (onEnd) onEnd();
                    return;
                }
                const utter = new SpeechSynthesisUtterance(sentences[index]);
                utter.lang = 'ko-KR';
                utter.rate = rate;
                utter.pitch = pitch;
                if (selectedTtsVoice) utter.voice = selectedTtsVoice;
                utter.onend = function() {
                    index++;
                    setTimeout(speakNext, 400);
                };
                window.speechSynthesis.speak(utter);
            }
            speakNext();
        }

        window.toggleListen = function() {
            if (isSpeaking) {
                stopSpeaking();
                return;
            }
            if (!generatedText) return;

            if (!window.NativeApp && !window.AndroidTTS && !('speechSynthesis' in window)) {
                alert("이 브라우저는 음성 읽기 기능을 지원하지 않습니다.");
                return;
            }

            isSpeaking = true;
            listenBtn.classList.add('active');
            listenBtn.innerHTML = "⏸ 읽는 중...";

            speakBysentences(generatedText, () => {
                listenBtn.classList.remove('active');
                listenBtn.innerHTML = "🔊 들어보기";
            });
        }

        function stopSpeaking() {
            if (window.NativeApp) window.NativeApp.ttsStop();
            else if (window.AndroidTTS) window.AndroidTTS.stop();
            else if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            isSpeaking = false;
            const btn = document.getElementById('listen-btn');
            if (btn) { btn.classList.remove('active'); btn.innerHTML = "🔊 들어보기"; }
        }

        // ---------------------------------------------------------
        // 기존 사전 녹음 방송 재생 (4개 카테고리)
        // ---------------------------------------------------------
        window.startBroadcast = function() {
            // 재생 중이면 중단
            if (isPlaying || uploadedIsPlaying || isSpeaking) {
                stopBroadcast();
                return;
            }

            // 방송문 작성에서 만든 방송문이 있고 카테고리 버튼이 선택되지 않은 경우 TTS 재생
            if (generatedText && !selectedButton && !uploadedAudioBuffer) {
                isSpeaking = true;
                isPlaying = true;
                mainPlayBtn.classList.add('active');
                mainPlayBtn.innerHTML = `⏹ 방송 중단`;
                const activeBtn = document.querySelector('.template-btn.active');
                const activeType = activeBtn ? activeBtn.getAttribute('onclick').replace("applyTemplate('", "").replace("')", "") : null;
                const templateName = activeType && activeType !== '직접입력' ? activeType : '방송문';
                statusDisplay.textContent = `🔊 재생 중: ${templateName}`;
                speakBysentences(generatedText, () => {
                    isSpeaking = false;
                    isPlaying = false;
                    mainPlayBtn.classList.remove('active');
                    mainPlayBtn.innerHTML = `▶ 재생 시작`;
                    statusDisplay.textContent = `대기: [${templateName}] 하단 재생 버튼을 눌러 방송하세요.`;
                });
                saveBroadcastRecord(templateName, generatedText, 'tts');
                return;
            }

            // 내 음성파일을 불러온 상태이고 카테고리 버튼이 선택되지 않은 경우만 재생
            if (uploadedAudioBuffer && !selectedButton) {
                stopUploadedAudio();
                try {
                    playUploadedAudio();
                    isPlaying = true;
                    mainPlayBtn.classList.add('active');
                    statusDisplay.innerHTML = `🔊 재생 중: ${uploadedAudioName}`;
                    mainPlayBtn.innerHTML = `⏹ 방송 중단`;
                    saveBroadcastRecord(uploadedAudioName, '', 'file');
                } catch(e) {
                    alert("파일 재생에 실패했습니다. mp3 또는 wav 파일을 사용해 주세요.");
                }
                return;
            }

            if (!selectedButton) {
                alert("방송할 주제를 먼저 클릭하거나, 방송문을 작성하거나, 음성파일을 불러와 주세요!");
                return;
            }
            let audioSrc;
            if (currentMode === 'adult-male') {
                audioSrc = selectedButton.getAttribute('data-adult-male');
            } else if (currentMode === 'adult-female') {
                audioSrc = selectedButton.getAttribute('data-adult-female');
            } else {
                audioSrc = selectedButton.getAttribute('data-child');
            }

            // 네이티브 MediaPlayer로 재생 (100% 안정적)
            const topicName = selectedButton.getAttribute('data-name');
            const modeName = currentMode === 'adult-male' ? '어른(남)' : currentMode === 'adult-female' ? '어른(여)' : '아이';

            if (window.NativeApp) {
                // 파일명만 추출 (audio/ 경로 제거)
                const filename = audioSrc.replace('audio/', '');
                window.NativeApp.playAudio(filename);
                isPlaying = true;
                mainPlayBtn.classList.add('active');
                statusDisplay.innerHTML = `🔊 재생 중: ${topicName} (${modeName} 목소리)`;
                mainPlayBtn.innerHTML = `⏹ 방송 중단`;
                saveBroadcastRecord(topicName, '', 'preset');
                return;
            }

            // 폴백: XMLHttpRequest + Web Audio API
            statusDisplay.innerHTML = `⏳ 불러오는 중: ${topicName}...`;
            const xhr = new XMLHttpRequest();
            xhr.open('GET', audioSrc, true);
            xhr.responseType = 'arraybuffer';
            xhr.onload = function() {
                const ctx = getAudioContext();
                ctx.decodeAudioData(xhr.response,
                    function(buffer) {
                        stopUploadedAudio();
                        uploadedAudioBuffer = buffer;
                        playUploadedAudio();
                        isPlaying = true;
                        mainPlayBtn.classList.add('active');
                        statusDisplay.innerHTML = `🔊 재생 중: ${topicName} (${modeName} 목소리)`;
                        mainPlayBtn.innerHTML = `⏹ 방송 중단`;
                        saveBroadcastRecord(topicName, '', 'preset');
                    },
                    function() {
                        alert(`음원 디코딩 실패: ${audioSrc}`);
                        statusDisplay.textContent = "상태: 방송할 주제를 선택해 주세요.";
                    }
                );
            };
            xhr.onerror = function() {
                alert(`음원을 불러올 수 없습니다: ${audioSrc}`);
                statusDisplay.textContent = "상태: 방송할 주제를 선택해 주세요.";
            };
            xhr.send();
        }

        window.changeSpeed = function(speedValue) {
            const rate = parseFloat(speedValue);
            if (audioPlayer) { audioPlayer.playbackRate = rate; }
            // Web Audio API 재생 중인 음원에도 실시간 배속 적용
            if (uploadedSourceNode) {
                uploadedSourceNode.playbackRate.value = rate;
            }
        }

        window.stopBroadcast = function() {
            if (window.NativeApp) window.NativeApp.stopAudio();
            audioPlayer.pause();
            audioPlayer.src = "";
            stopUploadedAudio();
            stopSpeaking();
            isPlaying = false;
            uploadedIsPlaying = false;
            mainPlayBtn.classList.remove('active');
            mainPlayBtn.innerHTML = `▶ 재생 시작`;
            updateStatusText();
        }

        function updateStatusText() {
            if (writePanel.classList.contains('open') || uploadPanel.classList.contains('open')) {
                return; // 방송문 작성/파일 불러오기 중에는 자체 안내 문구를 유지
            }
            if (selectedButton) {
                const topicName = selectedButton.getAttribute('data-name');
                const modeName = currentMode === 'adult-male' ? '어른(남)' : currentMode === 'adult-female' ? '어른(여)' : '아이';
                statusDisplay.textContent = `대기: [${topicName} - ${modeName} 목소리] 하단 재생 터치`;
            } else {
                statusDisplay.textContent = "상태: 방송할 주제를 선택해 주세요.";
            }
        }

        audioPlayer.onended = function() { stopBroadcast(); };

        // 앱 시작 시 설정/기록 초기화
        initApp();
    </script>
</body>
</html>
